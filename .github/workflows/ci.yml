name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (high and critical only)
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Server tests on SQLite in WebAssembly (the browser's database)
        run: npm run test:wasm
      - name: Build
        run: npm run build
      - name: Build the web version
        run: npm run build:standalone
      - name: Check for outbound URLs
        run: npm run check:network
      - name: Build the documentation (fails on a broken link or missing picture)
        run: npm run docs:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (production build, full CSP, and the web version)
        run: npm run test:e2e -- --project=chromium --project=standalone
      - name: Web version as a GitHub project site (base path, 404.html fallback, offline, docs)
        run: npm run verify:pages
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  pack:
    name: Build the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make the tarball (the build runs as part of npm pack)
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
        shell: bash
      - name: Check the tarball itself, install it, and run it on this system
        run: npm run package:npm-smoke -- --tarball "$RUNNER_TEMP/pack"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  package:
    name: npm package on ${{ matrix.os }}, Node ${{ matrix.node }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.14.0, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Scripts skipped: Windows with Node 22's npm tries to compile better-sqlite3 and fails.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package-under-test
      - name: Install the tarball in an empty project and run it (version, help, API, data folder, stop)
        run: npm run package:npm-smoke
        env:
          PACKAGE_TARBALL: package-under-test

  webkit-smoke:
    name: WebKit smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Smoke tests in WebKit (the server's app and the web version)
        run: npm run test:e2e -- --project=webkit --project=standalone-webkit --grep @smoke
      - name: Web version as a GitHub project site, in WebKit
        run: |
          npm run build:standalone
          npm run docs:build
          npx playwright test --project=pages-webkit
        env:
          MOSS_BASE: /mossnote/
          MOSS_EXPECT_BASE: /mossnote/
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-webkit
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
