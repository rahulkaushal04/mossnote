name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (high and critical only)
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Server tests on SQLite in WebAssembly (the browser's database)
        run: npm run test:wasm
      - name: Build
        run: npm run build
      - name: Build the web version
        run: npm run build:standalone
      - name: Check for outbound URLs
        run: npm run check:network
      - name: Build the documentation (fails on a broken link or missing picture)
        run: npm run docs:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (production build, full CSP, and the web version)
        run: npm run test:e2e -- --project=chromium --project=standalone
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  webkit-smoke:
    name: WebKit smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Smoke tests in WebKit (the server's app and the web version)
        run: npm run test:e2e -- --project=webkit --project=standalone-webkit --grep @smoke
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-webkit
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
