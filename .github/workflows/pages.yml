name: Web version

# Publishes the web version (the journal in the browser, no server) to GitHub Pages. It only runs
# when someone starts it by hand from the Actions tab: nothing is published by a push or a tag.
# Turn Pages on first: Settings, Pages, Source: GitHub Actions.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the web version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:wasm
      - name: Build for this repository's address
        run: npm run build:standalone
        env:
          # A project site lives at https://<owner>.github.io/<repository>/.
          MOSS_BASE: /${{ github.event.repository.name }}/
      - run: npm run check:network
      # The documentation is added after the outbound-URL check on purpose: it links to GitHub
      # pages the reader may click, and loads nothing from the network itself.
      - name: Build the documentation into the site (served at /docs/)
        run: npm run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/standalone

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
