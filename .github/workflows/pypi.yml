name: PyPI

# Builds the wheel, tests it on Linux, macOS and Windows, and publishes with trusted publishing
# (no token). A v* tag publishes to PyPI only when the variable PUBLISH_TO_PYPI is "true"; running
# it by hand publishes to TestPyPI or PyPI. An upload to PyPI also waits for the release checks
# (verify.yml). See "Releasing to PyPI" in CONTRIBUTING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repository:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: A tag matches the package version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: python -m pip install build
      - name: Make the wheel (refuses if python/pyproject.toml and package.json disagree)
        run: npm run package:python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: release/python/*.whl
          if-no-files-found: error

  test:
    name: Wheel on ${{ matrix.os }}, Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: python-dist
      - name: Install the wheel into an empty environment and run it
        run: python python/tests/wheel_smoke.py python-dist

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mossnote
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    name: Release checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') || (github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true') }}
    uses: ./.github/workflows/verify.yml

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test, verify]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') || (github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mossnote
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
