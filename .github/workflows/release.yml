name: Release

# A v* tag checks the code, builds and tests the programs (binaries.yml), drafts a release with them,
# then publishes the release and the npm package. A tag with a "-" is a prerelease: the npm dist-tag
# is the part after the "-" (beta), never "latest".
#
# Before the first publish, see "Releasing to npm" in CONTRIBUTING.md: the npm account and package
# name, the NPM_TOKEN secret and the PUBLISH_TO_NPM variable.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Check the code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:wasm
      - run: npm run build
      - run: npm run build:standalone
      - run: npm run check:network
      - name: The npm package builds, installs and runs
        run: npm run package:npm-smoke

  # What is attached to the release is exactly what binaries.yml tested.
  binaries:
    name: Programs
    needs: verify
    uses: ./.github/workflows/binaries.yml

  draft:
    name: Draft the release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mossnote-*
          merge-multiple: true
          path: release-files
      - name: The files are the ones that were tested
        run: |
          cd release-files
          ls -l
          for sum in *.sha256; do sha256sum -c "$sum"; done
      - name: Create a draft release with them
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag $prerelease --title "Mossnote $TAG" --generate-notes release-files/*

  npm:
    name: Publish the npm package
    needs: draft
    # Set the repository variable PUBLISH_TO_NPM to "true" and add an NPM_TOKEN secret to turn this on.
    if: ${{ vars.PUBLISH_TO_NPM == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Make the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install it in an empty project and run it
        run: npm run package:npm-smoke -- --tarball "$RUNNER_TEMP/pack"
      - name: Publish it
        run: |
          version="$(node -p "require('./package.json').version")"
          # 0.1.0-beta.1 goes under "beta"; only a version with no "-" may be "latest".
          case "$version" in
            *-*) pre="${version#*-}"; dist_tag="${pre%%.*}" ;;
            *) dist_tag="latest" ;;
          esac
          # A tag cannot look like a version number.
          case "$dist_tag" in ''|[0-9]*) dist_tag="next" ;; esac
          echo "Publishing $version under the dist-tag $dist_tag"
          npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    name: Publish the release
    needs: [draft, npm]
    if: ${{ !cancelled() && needs.draft.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release edit "$TAG" --draft=false
