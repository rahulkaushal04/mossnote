name: Release

# Pushing a tag such as v0.2.0 checks the code, builds the standalone Windows and Linux programs
# (each on its own system: the SQLite module is native and cannot be cross-compiled), tests each
# program by starting it, attaches them to a draft release and, once all of that has passed,
# publishes the release and the npm package. See decision 0006.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Check the code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:network

  draft:
    name: Draft the release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create a draft release
        run: gh release create "$TAG" --draft --verify-tag --title "Mossnote $TAG" --generate-notes

  binaries:
    name: Program for ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            program: build/package/mossnote.exe
          - os: ubuntu-latest
            target: linux-x64
            program: build/package/mossnote
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run build
      - name: Build the program
        run: npm run package:binary
      - name: Start it the way a person would, and check it works
        run: npm run package:smoke -- ${{ matrix.program }}
      - name: Attach it to the draft release
        run: gh release upload "$TAG" release/* --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossnote-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  npm:
    name: Publish the npm package
    needs: binaries
    # Set the repository variable PUBLISH_TO_NPM to "true" and add an NPM_TOKEN secret to turn this on.
    if: ${{ vars.PUBLISH_TO_NPM == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # `prepack` builds dist before the package is made.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    name: Publish the release
    needs: [binaries, npm]
    if: ${{ !cancelled() && needs.binaries.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release edit "$TAG" --draft=false
