name: Verify

# The checks every release needs before anything is published: lint, formatting, types, the tests
# on Node and on WebAssembly, the builds, the no-network check and the npm package. release.yml and
# pypi.yml both call it, so a tag that fails them reaches neither npm nor PyPI.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Check the code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the package version
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:wasm
      - run: npm run build
      - run: npm run build:standalone
      - run: npm run check:network
      - name: The npm package builds, installs and runs
        run: npm run package:npm-smoke
