[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mossnote"
# PEP 440 form of package.json's version (0.1.0-beta.1). `npm run package:python` checks they agree.
version = "0.1.0b1"
description = "A private, spoiler-free journal for the games you play. Runs on your computer; no Node.js needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Kaushal" }]
keywords = ["journal", "notes", "games", "local-first", "offline", "spoiler-free"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# The Node.js that runs the app (versions are Node's own). 22.14 is the oldest that loads the SQLite module.
dependencies = ["nodejs-wheel-binaries>=22.14.0,<27"]

[project.scripts]
mossnote = "mossnote.cli:main"

[project.urls]
Homepage = "https://github.com/rahulkaushal04/mossnote"
Documentation = "https://rahulkaushal04.github.io/mossnote/docs/"
"Web version" = "https://rahulkaushal04.github.io/mossnote/"
Source = "https://github.com/rahulkaushal04/mossnote"
Changelog = "https://github.com/rahulkaushal04/mossnote/blob/main/CHANGELOG.md"
Issues = "https://github.com/rahulkaushal04/mossnote/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mossnote"]
# `_app` is copied in by `npm run package:python` and is not in git, so it is named here.
artifacts = ["src/mossnote/_app/**"]
